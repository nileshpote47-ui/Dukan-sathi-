# Dukan Sathi — Phase 1 specification
# The original PHASE_1_PROMPT.yaml was not available, so this spec was
# defined from the project name: "Dukan Sathi" = "shop companion", an app
# for small Indian retail shops (kirana / general stores).

project: Dukan Sathi
phase: 1
title: Offline-first shop management MVP

goal: >
  Give a single shopkeeper one app, usable on a phone or desktop browser,
  to manage stock, make bills, track customer credit (udhaar) and see
  today's sales. Works fully offline; data stays on the device.

stack:
  frontend: React 19 + TypeScript, built with Vite
  storage: Browser localStorage behind a small typed data layer (swappable for a backend in Phase 2)
  tests: Vitest for the domain logic
  styling: Plain CSS, mobile-first

features:
  inventory:
    - Add, edit and delete products (name, unit, selling price, cost price, stock qty, low-stock level)
    - Search products by name
    - Highlight products at or below their low-stock level
  billing:
    - Build a bill by adding products and quantities
    - Optional bill-level discount
    - Pay by cash, UPI or credit (udhaar); credit requires a customer
    - Saving a bill reduces stock; quantity cannot exceed stock
    - Bill history with totals
  customers_and_udhaar:
    - Add customers (name, phone)
    - Credit bills increase the customer's balance
    - Record payments received against the balance
    - Per-customer ledger of credits and payments
  dashboard:
    - Today's sales total and bill count
    - Today's gross profit (selling price minus cost price)
    - Total outstanding udhaar
    - Low-stock product list
  general:
    - Currency in Indian rupees (en-IN formatting)
    - Export and import all data as JSON (backup and restore)

non_goals_phase_1:
  - User accounts, login and cloud sync (Phase 2)
  - GST invoices and printing (later phase)
  - Barcode scanning (later phase)
  - Multiple shops or staff roles (later phase)

acceptance:
  - npm run build succeeds with no type errors
  - npm test passes (billing, stock and ledger logic covered)
  - All four screens are usable at phone width (360px)
